<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="한국사능력검정시험 심화 회독 기록과 정답 확인 도구"><title>한능검 심화 회독 기록</title>
  <style>
    :root{--ink:#132b40;--paper:#fffdf8;--line:#d9e1df;--accent:#c5522a;--muted:#63727c;--teal:#147b79;--soft:#e6f3ef;--danger:#9c2f1b}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f1f4f1;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}header{padding:48px max(24px,calc((100% - 1080px)/2));color:#fff;background:linear-gradient(120deg,#12344b,#176e70)}h1{margin:0 0 8px;font-size:clamp(28px,4vw,44px);letter-spacing:-.06em}header p{margin:0;opacity:.88}main{max-width:1080px;margin:0 auto;padding:28px 24px 56px}.panel{padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 9px 25px #172d3720}.toolbar{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}label{display:block;margin-bottom:8px;font-size:14px;font-weight:700}select,button{font:inherit}select{width:100%;padding:12px 14px;border:1px solid #afbfbe;border-radius:10px;background:#fff;color:var(--ink);font-size:16px}.pill,.stat{padding:8px 10px;border-radius:999px;background:#e5ece9;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}button{padding:10px 13px;border:1px solid #b8c7c5;border-radius:10px;background:#fff;color:var(--ink);cursor:pointer;font-weight:700}button.primary{border-color:var(--teal);background:var(--teal);color:#fff}button.danger{border-color:#e4b5a9;color:var(--danger)}button:hover{filter:brightness(.97)}.status{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}.stat{background:var(--soft);color:#19564f}.notice{margin:20px 0;padding:14px 16px;border-radius:12px;background:#e6f3ef;color:#19564f;font-size:14px;line-height:1.55}.questions{display:grid;grid-template-columns:repeat(1,1fr);gap:10px}.question{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}.question.correct{border-color:#8fc6a2;background:#f0faf2}.question.wrong{border-color:#e3b0a5;background:#fff5f1}.number{font-weight:800;text-align:center}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.choice{padding:8px 3px;border-radius:8px;font-size:15px}.choice.selected{border-color:var(--teal);background:#d9f0ed;color:#0c5957}.choice.answer{outline:2px solid #4e9a62;outline-offset:1px}.choice.incorrect{border-color:#c5522a;background:#ffe6de;color:#9c2f1b}.history{margin-top:26px}.history h2{font-size:20px;margin:0 0 12px}.history-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.history-card{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}.history-card strong{display:block}.attempts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.attempt{padding:5px 7px;border-radius:8px;background:var(--soft);font-size:12px;color:#19564f}.source,.note{margin-top:24px;color:var(--muted);font-size:13px;line-height:1.7}a{color:#0b6262;font-weight:700}@media(min-width:700px){.questions{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.toolbar{grid-template-columns:1fr}.choices{gap:4px}.choice{padding:8px 1px}}
  </style>
</head>
<body>
  <header><h1>한능검 심화 회독 기록</h1><p>1·2·3급 대비용 심화 기출 - 풀고, 채점하고, 회독을 남기세요.</p></header>
  <main>
    <section class="panel"><div class="toolbar"><div><label for="round">회차 선택</label><select id="round"></select></div><div id="roundInfo" class="pill"></div></div><div class="actions"><button id="grade" class="primary">채점하고 회독 저장</button><button id="restart">새 회독 시작</button><button id="export">기록 백업</button><label><input id="import" type="file" accept="application/json" hidden><button type="button" id="importButton">백업 불러오기</button></label><button id="clear" class="danger">전체 기록 삭제</button></div></section>
    <div id="status" class="status"></div><div id="notice" class="notice"></div><section id="questions" class="questions" aria-live="polite"></section>
    <section class="history"><h2>회독 현황</h2><div id="history" class="history-grid"></div></section>
    <p id="source" class="source"></p><p class="note">기록은 이 브라우저의 로컬 저장공간에 자동 저장됩니다. 다른 브라우저·기기에서도 이어하려면 ‘기록 백업’을 내려받아 보관한 뒤 ‘백업 불러오기’를 사용하세요.</p>
  </main>
  <script src="./answers.js"></script>
  <script>
    const data=window.HANGUKSA_ANSWERS,KEY='hanguksa-advanced-study-v1',choices=['①','②','③','④','⑤'];
    const $=s=>document.querySelector(s),select=$('#round'),questions=$('#questions'),notice=$('#notice'),status=$('#status'),history=$('#history');
    let store=load(),currentRound=Number(localStorage.getItem(KEY+'-round'))||data.rounds[data.rounds.length-1].round;
    function blank(){return{draft:{},graded:false,attempts:[],currentAttempt:1}}function load(){try{return JSON.parse(localStorage.getItem(KEY))||{rounds:{}}}catch{return{rounds:{}}}}function save(){localStorage.setItem(KEY,JSON.stringify(store));localStorage.setItem(KEY+'-round',String(currentRound))}function record(){const r=store.rounds[currentRound]||(store.rounds[currentRound]=blank());if(!r.currentAttempt)r.currentAttempt=r.attempts.length+1;return r}function test(){return data.rounds.find(x=>x.round===currentRound)}function percent(score){return Math.round(score/50*100)}
    function render(){const row=test(),r=record(),selected=Object.keys(r.draft).length,score=Object.entries(r.draft).filter(([n,c])=>row.answers[Number(n)-1]===c).length;select.value=currentRound;$('#roundInfo').textContent=`${row.date} · ${r.graded?`${r.attempts.length}회독 완료`:`${r.currentAttempt}회독 진행 중`}`;$('#source').innerHTML=`공식 원문: <a href="${row.source}" target="_blank" rel="noreferrer">국사편찬위원회 시험 자료실</a>`;status.innerHTML=`<span class="stat">${selected}/50 답안 선택</span>${r.graded?`<span class="stat">${r.currentAttempt}회독 점수 ${score}/50 · ${percent(score)}점</span>`:''}`;notice.textContent=r.graded?'채점 결과입니다. 이 점수는 회독 현황에 저장됐어요. 새 회독을 시작해도 이전 기록은 남습니다.':'답을 고르면 자동 저장됩니다. 전부 풀지 않아도 채점할 수 있어요.';questions.innerHTML=row.answers.map((answer,i)=>{const n=i+1,chosen=r.draft[n]||'';return `<article class="question ${r.graded?(chosen===answer?'correct':'wrong'):''}"><span class="number">${n}</span><div class="choices">${choices.map(c=>`<button class="choice ${chosen===c?'selected':''} ${r.graded&&c===answer?'answer':''} ${r.graded&&chosen===c&&c!==answer?'incorrect':''}" data-n="${n}" data-choice="${c}" ${r.graded?'disabled':''}>${c}</button>`).join('')}</div></article>`}).join('');renderHistory()}
    function renderHistory(){history.innerHTML=data.rounds.slice().reverse().map(row=>{const r=store.rounds[row.round]||blank(),scores=r.attempts.map(x=>x.score),best=scores.length?Math.max(...scores):null,items=r.attempts.map((x,i)=>`<span class="attempt">${x.round||i+1}회독 ${x.score}/50 · ${percent(x.score)}점</span>`).join('');return `<article class="history-card"><strong>${row.round}회</strong><span>${r.attempts.length}회독${best!==null?` · 최고 ${best}/50`:''}</span>${items?`<div class="attempts">${items}</div>`:''}</article>`}).join('')}
    data.rounds.slice().reverse().forEach(x=>{const o=document.createElement('option');o.value=x.round;o.textContent=`${x.round}회 · ${x.date}`;select.append(o)});select.addEventListener('change',()=>{currentRound=Number(select.value);save();render()});questions.addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;record().draft[b.dataset.n]=b.dataset.choice;save();render()});
    $('#grade').addEventListener('click',()=>{const r=record(),row=test();if(r.graded)return;const score=Object.entries(r.draft).filter(([n,c])=>row.answers[Number(n)-1]===c).length;r.graded=true;r.attempts.push({round:r.currentAttempt,date:new Date().toLocaleString('ko-KR'),score,answered:Object.keys(r.draft).length});save();render()});$('#restart').addEventListener('click',()=>{const r=record();if(Object.keys(r.draft).length&&!confirm('현재 답안만 비우고 다음 회독을 시작할까요? 이전 회독 점수는 그대로 남습니다.'))return;r.draft={};r.graded=false;r.currentAttempt=r.attempts.length+1;save();render()});
    $('#export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hanguksa-advanced-study-record.json';a.click();URL.revokeObjectURL(a.href)});$('#importButton').addEventListener('click',()=>$('#import').click());$('#import').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result);if(!imported||typeof imported.rounds!=='object')throw 0;store=imported;save();render();alert('기록을 불러왔습니다.')}catch{alert('올바른 백업 파일이 아닙니다.')}};reader.readAsText(f);e.target.value=''});$('#clear').addEventListener('click',()=>{if(!confirm('모든 회독 기록과 현재 답안을 삭제할까요?'))return;store={rounds:{}};save();render()});render();
  </script>
</body>
</html>
